name: C++ Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Install dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y cmake ninja-build g++ libgtest-dev libgmock-dev
      #     sudo apt install -y llvm-dev libclang-dev libclang-cpp-dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            llvm-dev \
            clang \
            libclang-dev \
            libclang-cpp-dev \
            libgtest-dev \
            libgmock-dev

      - name: Check LLVM installation
        run: |
          llvm-config --version
          clang --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
